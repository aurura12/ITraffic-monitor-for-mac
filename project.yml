name: ITrafficMonitorForMac

options:
  minimumXcodeGenVersion: 2.44.0
  createIntermediateGroups: true
  developmentLanguage: en

configs:
  Debug: debug
  Release: release

settings:
  base:
    PRODUCT_NAME: ITraffic
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  ITrafficMonitorForMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ITrafficMonitorForMac
        excludes:
          - Info.plist
          - ITrafficMonitorForMac.entitlements
          - Assets.xcassets
          - "Preview Content"
          - Base.lproj
          - NetworkFilter
      - path: ITrafficMonitorForMac/GeneratedBuildInfo.swift
      - path: ITrafficMonitorForMac/NetworkFilter/Shared
      - path: ITrafficMonitorForMac/Assets.xcassets
        buildPhase: resources
      - path: ITrafficMonitorForMac/Preview Content/Preview Assets.xcassets
        buildPhase: resources
      - path: ITrafficMonitorForMac/Base.lproj/Main.storyboard
        buildPhase: resources
    preBuildScripts:
      - name: Generate Build Info
        basedOnDependencyAnalysis: false
        script: |
          #!/bin/bash
          set -e
          # Build counter. Keep it in Xcode's derived data by default so
          # sandboxed and CI builds do not need home-directory access.
          # Set ITRAFFIC_BUILD_COUNTER_DIR to preserve it across clean builds.
          COUNTER_DIR="${ITRAFFIC_BUILD_COUNTER_DIR:-${DERIVED_FILE_DIR:-${TMPDIR:-/tmp}/com.foamzou.ITrafficMonitorForMac}}"
          mkdir -p "$COUNTER_DIR"
          COUNTER_FILE="$COUNTER_DIR/buildcounter"
          N=1
          if [ -f "$COUNTER_FILE" ]; then
            PREV=$(cat "$COUNTER_FILE" 2>/dev/null | tr -d '[:space:]')
            if [ -n "$PREV" ] && [ "$PREV" -ge 0 ] 2>/dev/null; then
              N=$((PREV + 1))
            fi
          fi
          echo "$N" > "$COUNTER_FILE"
          OUT="$SRCROOT/ITrafficMonitorForMac/GeneratedBuildInfo.swift"
          {
            echo "// Generated by the ITraffic build script — do not edit."
            echo "enum GeneratedBuildInfo {"
            echo "    /// Monotonic per-machine build counter (increments on every build)."
            echo "    static let buildNumber: Int = $N"
            echo "    /// Local time the build script ran."
            echo "    static let buildDate: String = \"$(date '+%Y-%m-%d %H:%M:%S')\""
            echo "}"
          } > "$OUT"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        CURRENT_PROJECT_VERSION: 10
        DEVELOPMENT_ASSET_PATHS: "\"ITrafficMonitorForMac/Preview Content\""
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
        INFOPLIST_FILE: ITrafficMonitorForMac/Info.plist
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        MARKETING_VERSION: 0.3.2
        PRODUCT_BUNDLE_IDENTIFIER: com.foamzou.ITrafficMonitorForMac
        OTHER_LDFLAGS:
          - "-lsqlite3"
        SWIFT_VERSION: 5.0

  # The Network Extension implementation is intentionally kept under
  # ITrafficMonitorForMac/NetworkFilter, but is not part of the default free
  # project. It requires a signed Apple Developer Team and a real install /
  # enablement flow before it can be shipped safely.

  ITrafficMonitorForMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ITrafficMonitorForMacTests
    dependencies:
      - target: ITrafficMonitorForMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.foamzou.ITrafficMonitorForMacTests
        PRODUCT_NAME: ITrafficMonitorForMacTests
        SWIFT_MODULE_NAME: ITrafficMonitorForMacTests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ITraffic.app/Contents/MacOS/ITraffic"
        SWIFT_VERSION: 5.0
        OTHER_LDFLAGS:
          - "-lsqlite3"

schemes:
  ITrafficMonitorForMac:
    build:
      targets:
        ITrafficMonitorForMac: all
    run:
      config: Debug
    analyze:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - ITrafficMonitorForMacTests
